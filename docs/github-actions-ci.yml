# GitHub Actions CI for the metadata management platform.
#
# NOTE: this file lives in docs/ (not .github/workflows/) because the
# GitHub App used to publish this repository lacks the Workflows
# permission. To activate CI, move this file to .github/workflows/ci.yml.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: pip install pytest
      - name: Run tests
        run: pytest -q
